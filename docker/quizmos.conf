server {
    listen 8080;
    server_name _;
    root /opt/quizmos;

    # QuizMos uses hash routes. A missing static asset should remain a 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
