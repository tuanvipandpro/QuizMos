name: Frontend CI

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      profile:
        required: true
        type: string
      shards:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE: /
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn verify
        env:
          VITE_APP_AI_URL: ${{ vars.VITE_APP_AI_URL }}
          VITE_EXAM_HISTORY_ENABLED: ${{ vars.VITE_EXAM_HISTORY_ENABLED || 'false' }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON('["main","master"]'), github.event.repository.default_branch) && inputs.release
        with:
          name: site-build
          overwrite: true
          path: dist/
          retention-days: 1
          if-no-files-found: error

  rules:
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: yarn test:rules
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rules-failure-details
          path: |
            firebase-debug.log
            firestore-debug.log
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      CI_PROFILE: ${{ inputs.profile }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dependency-platform: playwright-${{ hashFiles('.github/workflows/frontend.yml') }}
      - run: node scripts/check-browser-image.mjs
      - name: Run selected browser checks
        run: |
          if [ "$CI_PROFILE" = "assets" ]; then
            yarn test:e2e --grep @smoke
          else
            yarn test:e2e --shard="$SHARD_INDEX/$SHARD_TOTAL"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-details-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  frontend-check:
    needs: [verify, rules, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci-gate.mjs frontend
        env:
          CI_PROFILE: ${{ inputs.profile }}
          CI_RESULTS: ${{ toJSON(needs) }}
